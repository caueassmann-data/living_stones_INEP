[project]
name = "brazil-school-dropout-risk"
version = "0.3.0"
description = "School-level early-warning prototype for Brazilian basic education dropout (Ensino Fundamental and Ensino Medio)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is enforced by formatting, not worth failing CI over in notebooks-adjacent scripts
]

[tool.ruff.lint.isort]
known-first-party = ["src", "app", "scripts"]
